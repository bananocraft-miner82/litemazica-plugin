# Decompiling and remapping Minecraft (Loom, ModDevGradle) is memory-hungry;
# the default heap is not enough and fails in CI before it fails locally.
org.gradle.jvmargs=-Xmx3G

org.gradle.parallel=true
org.gradle.caching=true

# Seed version for the very first automated release only. Once a v* tag exists,
# the merge workflow (.github/workflows/merge.yml) ignores this and patch-bumps
# the latest tag instead. Bump the major/minor here yourself when you want the
# next release series to jump (e.g. 1.4.7 -> set 2.0.0 and delete/skip tags).
baseVersion=1.0.0
